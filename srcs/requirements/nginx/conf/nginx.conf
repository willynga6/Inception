server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name wngambi.42.fr;

    # SSL/TLS
    ssl_certificate     /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/html;
    index index.php index.html;

    # Site statique (bonus)

    location = /static { return 301 /static/; }

    location ^~ /static/ {
	proxy_pass http://static:8081/;
    }

    # Fichiers statiques et permaliens WordPress
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Requêtes PHP -> conteneur wordpress (php-fpm)
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass wordpress:9000;
    }

    # Adminer
    location = /adminer { return 301 /adminer/; }

    location ^~ /adminer/ {
        proxy_pass          http://adminer:8080/;
        proxy_set_header    Host $host;
        proxy_set_header    X-Real-IP $remote_addr;
        proxy_set_header    X-Forwarded-Proto https;
    }

    # Mailpit
    location = /mailpit { return 301 /mailpit/; }

    location ^~ /mailpit/ {
        proxy_pass          http://mailpit:8025;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host $host;
        proxy_set_header    X-Forwarded-Proto https;
    }
}
