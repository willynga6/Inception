# /etc/redis/redis.conf

# Network: listen on all interfaces inside the container so the
# WordPress container can reach it over the Docker network.
bind 0.0.0.0
port 6379
protected-mode no

# Run in the foreground (required for a Docker container's PID 1)
daemonize no

# Only one database (index 0)
databases 1

# Cache behavior: cap memory and evict the least recently used keys
maxmemory 256mb
maxmemory-policy allkeys-lru

# It's a cache, so no persistence is needed
save ""
appendonly no

# Logging to stdout so `docker logs` works
logfile ""
loglevel notice
